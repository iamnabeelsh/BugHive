<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BugHive</title>
  <link rel="stylesheet" href="homepage.css">
  <link link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
    <header class="header">
      <a href="homepage.html" class="header-left">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">BugHive</span>
      <span class="logo-tag">v 2.0</span>
        </a>
  </header>

        <div class="header-right">
            <span class="stat-pill" id="stat-open">0 Open</span>
            <span class="stat-pill stat-critical" id="stat-critical">0 Critical</span>
            <span class="stat-pill stat-resolved" id="stat-resolved">0 Resolved</span>
        </div>
    </header>

    <main class="main">
        <aside class="panel panel-form">
            <div class="panel-title">
                <span class="panel-num">01</span>
                <span>Report Bug</span>
            </div>
            <div class="form-group">
                <label for="bug-title">Title</label>
                <input id="bug-title" type="text" placeholder="Short, descriptive title…" maxlength="80" />
            </div>
            <div class="form-group">
                <label for="bug-desc">Description</label>
                <textarea id="bug-desc" rows="4" placeholder="Steps to reproduce, expected vs actual…"></textarea>
            </div>
            <div class="form-row">
                <div class="form-group half">
                    <label for="bug-priority">Priority</label>
                    <select id="bug-priority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                        <option value="critical">Critical</option>
                    </select>
                </div>
                <div class="form-group half">
                    <label for="bug-tag">Tag</label>
                    <select id="bug-tag">
                        <option value="UI">UI</option>
                        <option value="Backend">Backend</option>
                        <option value="Auth">Auth</option>
                        <option value="Performance">Performance</option>
                        <option value="Database">Database</option>
                        <option value="API">API</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label for="bug-assignee">Assignee</label>
                <input id="bug-assignee" type="text" placeholder="e.g. @alex" />
            </div>
            <button class="btn-submit" id="submit-bug">
                <span>+ File Bug Report</span>
            </button>

            <div class="panel-title" style="margin-top:2rem">
                <span class="panel-num">02</span>
                <span>Filter</span>
            </div>
            <div class="filter-group">
                <input id="search-input" type="text" placeholder="Search title…" />
            </div>
            <div class="filter-group">
                <label>Status</label>
                <div class="filter-pills" id="filter-status">
                    <button class="fpill active" data-val="all">All</button>
                    <button class="fpill" data-val="open">Open</button>
                    <button class="fpill" data-val="in-progress">In Progress</button>
                    <button class="fpill" data-val="resolved">Resolved</button>
                </div>
            </div>
            <div class="filter-group">
                <label>Priority</label>
                <div class="filter-pills" id="filter-priority">
                    <button class="fpill active" data-val="all">All</button>
                    <button class="fpill" data-val="critical">Critical</button>
                    <button class="fpill" data-val="high">High</button>
                    <button class="fpill" data-val="medium">Medium</button>
                    <button class="fpill" data-val="low">Low</button>
                </div>
            </div>





        </aside>
    </main>

</body>

</html>
